name: Load test (nightly)

# The 2,000 answers/s target. The per-push smoke job (ci.yml, loadtest-smoke) holds the 500/s line.
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  # Keep in sync with the Bun version used to write backend/bun.lock and frontend/bun.lock.
  BUN_VERSION: 1.4.3

jobs:
  loadtest:
    name: Answer storm at 2,000/s
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      MONGO_URI: mongodb://127.0.0.1:27017/openpoll_loadtest?directConnection=true
      REDIS_URL: redis://127.0.0.1:6379/0
      STORM_MIN_RPS: ${{ vars.STORM_NIGHTLY_MIN_RPS || '1900' }}
      STORM_MAX_P95_MS: ${{ vars.STORM_NIGHTLY_MAX_P95_MS || '150' }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Answer storm over REST at 2,000/s
        run: bun loadtest/answer-storm.ts --spawn --mode rest --participants 1000 --slides 20 --rate 2000 --json storm-rest.json

      - name: Answer storm over Socket.io at 2,000/s
        run: bun loadtest/answer-storm.ts --spawn --mode socket --participants 1000 --slides 20 --rate 2000 --json storm-socket.json

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loadtest-nightly
          path: backend/storm-*.json
          if-no-files-found: ignore
          retention-days: 14
