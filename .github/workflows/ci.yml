name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep in sync with the Bun version used to write backend/bun.lock and frontend/bun.lock.
  BUN_VERSION: 1.4.3

jobs:
  backend:
    name: Backend (typecheck + test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      # Unit tests stub Mongo/Redis; point at unreachable hosts so nothing reaches a real service.
      NODE_ENV: test
      MONGO_URI: mongodb://127.0.0.1:1/open-poll-ci
      REDIS_URL: redis://127.0.0.1:1
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun x tsc --noEmit

      # Only backend/tests/**; the OIDC integration suite in testing/oidc needs a live IdP and is not run here.
      - name: Test
        run: bun test

  frontend:
    name: Frontend (typecheck + lint + unit tests + build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: 1
      # Inlined into the client bundle at build time; dummy values are enough for CI.
      NEXT_PUBLIC_API_URL: http://localhost:5000
      NEXT_PUBLIC_SOCKET_URL: http://localhost:5000
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun run test

      - name: Build
        run: bun run build
