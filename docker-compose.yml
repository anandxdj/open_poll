services:
  redis:
    image: redis:7-alpine
    container_name: openpoll-redis
    restart: unless-stopped

    command: ["redis-server", "--appendonly", "yes"]

    volumes:
      - redis_data:/data

    networks:
      - traefik

  openpoll-backend:
    build:
      context: ./backend

    container_name: openpoll-backend
    restart: unless-stopped

    env_file:
      - .env

    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      # PPTX imports render charts and SmartArt through Gotenberg (backend/docs/wiki/modules/imports.md).
      GOTENBERG_URL: http://gotenberg:3000

    depends_on:
      - redis
      - gotenberg

    networks:
      - traefik

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.openpoll-backend.rule=Host(`openpoll-backend.anands.dev`)"
      - "traefik.http.routers.openpoll-backend.entrypoints=websecure"
      - "traefik.http.routers.openpoll-backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.openpoll-backend.loadbalancer.server.port=8080"
      - "traefik.docker.network=traefik"

  # LibreOffice behind an HTTP API, reachable only from the backend (no Traefik labels, no ports).
  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: openpoll-gotenberg
    restart: unless-stopped
    command: ["gotenberg", "--api-timeout=120s", "--chromium-disable-routes=true"]
    mem_limit: 1g
    networks:
      - traefik

networks:
  traefik:
    external: true

volumes:
  redis_data: